<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GCal Time Tracker Helper - Options</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>GCal Time Tracker Helper</h1>

    <section>
      <h2>Time Tracking Calendar</h2>
      <p>Enter the exact name of the calendar to create events on (case-sensitive).</p>
      <p class="hint">If multiple calendars share the same name, the first match in the sidebar will be used.</p>
      <div class="calendar-input">
        <input type="text" id="calendar-name" placeholder="e.g. Time tracking">
        <button id="save-calendar-btn">Save</button>
      </div>
    </section>

    <section>
      <h2>Projects</h2>
      <p>These will appear as quick-create buttons on Google Calendar.</p>
      <div class="add-group">
        <input type="text" id="new-group" placeholder="e.g. Engineering">
        <button id="add-group-btn">Add Group</button>
      </div>
      <div id="group-list"></div>
      <div class="add-project">
        <input type="text" id="new-project" placeholder="e.g. [Research]">
        <button id="add-project-btn">Add</button>
      </div>
    </section>

    <div id="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
